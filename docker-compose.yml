# Base de datos MySQL para el Control Horario
# Arrancar:  docker compose up -d
# Parar:     docker compose down        (los datos se conservan)
# Borrar todo y empezar de cero:  docker compose down -v
services:
  mysql:
    image: mysql:8.4
    container_name: fichajes-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fichajes
      MYSQL_USER: fichajes
      MYSQL_PASSWORD: fichajes
    ports:
      - "3306:3306"
    volumes:
      - datos:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d

volumes:
  datos:
